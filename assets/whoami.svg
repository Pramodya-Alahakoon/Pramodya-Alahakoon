<svg viewBox="0 0 1000 236" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="About Pramodya Alahakoon">
  <style>
    :root { --ink:#111111; --muted:#5F6368; --dim:#8A8A8A; --rule:#C9C9C9; --ghost:#DADADA; --node:#FFFFFF; }
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .rise { opacity:0; animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    .fade { opacity:0; animation:fade .7s ease forwards; }
    .draw { stroke-dasharray:1200; stroke-dashoffset:1200; animation:draw 1.5s cubic-bezier(.6,0,.2,1) forwards; }
    .a1{animation-delay:.08s}.a2{animation-delay:.18s}.a3{animation-delay:.30s}.a4{animation-delay:.42s}.a5{animation-delay:.54s}.a6{animation-delay:.66s}.a7{animation-delay:.78s}
    @keyframes rise { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fade { to{opacity:1} }
    @keyframes draw { to{stroke-dashoffset:0} }
    @media (prefers-reduced-motion:reduce) { .rise,.fade,.draw{animation:none;opacity:1}.draw{stroke-dashoffset:0} }
  </style>
  <text class="mono rise a1" x="48" y="32" font-size="16" fill="var(--ink)">fourth-year Software Engineering undergraduate at SLIIT.</text>
  <text class="mono rise a2" x="48" y="60" font-size="16" fill="var(--ink)">building full-stack web systems, mobile applications, and backend services.</text>
  <text class="mono rise a3" x="48" y="88" font-size="15" fill="var(--muted)">focused on maintainable architecture, reliable APIs, and useful software.</text>
  <line class="rise a4" x1="48" y1="116" x2="952" y2="116" stroke="var(--rule)" stroke-width="1" opacity=".75"/>
  <text class="mono rise a4" x="48" y="148" font-size="11" fill="var(--muted)" letter-spacing="2.5">FOCUS</text>
  <text class="mono rise a4" x="154" y="148" font-size="15" fill="var(--ink)">React · Next.js · Node.js · Java · Kotlin · Flutter</text>
  <text class="mono rise a5" x="48" y="182" font-size="11" fill="var(--muted)" letter-spacing="2.5">STATUS</text>
  <text class="mono rise a5" x="154" y="182" font-size="15" fill="var(--ink)">Software Engineer Intern · open to collaboration</text>
  <text class="mono rise a6" x="48" y="216" font-size="11" fill="var(--muted)" letter-spacing="2.5">BASE</text>
  <text class="mono rise a6" x="154" y="216" font-size="15" fill="var(--ink)">Sri Lanka · SLIIT · Asipiya International</text>
</svg>