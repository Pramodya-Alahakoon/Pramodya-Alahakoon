<svg viewBox="0 0 1000 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Selected projects by Pramodya Alahakoon">
  <style>
    :root { --ink:#111111; --muted:#5F6368; --dim:#8A8A8A; --rule:#C9C9C9; --ghost:#DADADA; --node:#FFFFFF; }
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .rise { opacity:0; animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    .fade { opacity:0; animation:fade .7s ease forwards; }
    .draw { stroke-dasharray:1200; stroke-dashoffset:1200; animation:draw 1.5s cubic-bezier(.6,0,.2,1) forwards; }
    .a1{animation-delay:.08s}.a2{animation-delay:.18s}.a3{animation-delay:.30s}.a4{animation-delay:.42s}.a5{animation-delay:.54s}.a6{animation-delay:.66s}.a7{animation-delay:.78s}
    @keyframes rise { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fade { to{opacity:1} }
    @keyframes draw { to{stroke-dashoffset:0} }
    @media (prefers-reduced-motion:reduce) { .rise,.fade,.draw{animation:none;opacity:1}.draw{stroke-dashoffset:0} }
  </style>
  <g class="rise a1" transform="translate(0 20)">
      <text class="mono" x="48" y="24" font-size="17" font-weight="700" fill="var(--ink)" letter-spacing=".8">01 / MEDILINK CLOUD</text>
      <text class="mono" x="48" y="51" font-size="12" fill="var(--ink)">AI-enabled distributed healthcare appointment system using microservices and event-driven communication.</text>
      <text class="mono" x="48" y="72" font-size="12" fill="var(--muted)">Role-based dashboards, telemedicine workflows, and containerized service deployment.</text>
      <text class="mono" x="48" y="94" font-size="11" fill="var(--ink)" letter-spacing=".4">REACT · NODE.JS · MONGODB · RABBITMQ · DOCKER</text>
      <line x1="48" y1="108" x2="952" y2="108" stroke="var(--rule)" stroke-width="1"/>
    </g>
<g class="rise a2" transform="translate(0 140)">
      <text class="mono" x="48" y="24" font-size="17" font-weight="700" fill="var(--ink)" letter-spacing=".8">02 / FUTURES PNL CALCULATOR</text>
      <text class="mono" x="48" y="51" font-size="12" fill="var(--ink)">Responsive calculator for Binance USDT-M futures positions, fees, returns, and risk estimates.</text>
      <text class="mono" x="48" y="72" font-size="12" fill="var(--muted)">Handles long and short trades, ROE, net PnL, and estimated liquidation prices.</text>
      <text class="mono" x="48" y="94" font-size="11" fill="var(--ink)" letter-spacing=".4">REACT · JAVASCRIPT · ANT DESIGN</text>
      <line x1="48" y1="108" x2="952" y2="108" stroke="var(--rule)" stroke-width="1"/>
    </g>
<g class="rise a3" transform="translate(0 260)">
      <text class="mono" x="48" y="24" font-size="17" font-weight="700" fill="var(--ink)" letter-spacing=".8">03 / BOTANIQ PLANT STORE</text>
      <text class="mono" x="48" y="51" font-size="12" fill="var(--ink)">Native Android shopping application with a searchable catalogue, favorites, and local cart.</text>
      <text class="mono" x="48" y="72" font-size="12" fill="var(--muted)">Designed around Activities, Fragments, XML layouts, and offline data persistence.</text>
      <text class="mono" x="48" y="94" font-size="11" fill="var(--ink)" letter-spacing=".4">KOTLIN · ANDROID XML · SHAREDPREFERENCES</text>
      <line x1="48" y1="108" x2="952" y2="108" stroke="var(--rule)" stroke-width="1"/>
    </g>
<g class="rise a4" transform="translate(0 380)">
      <text class="mono" x="48" y="24" font-size="17" font-weight="700" fill="var(--ink)" letter-spacing=".8">04 / WILD SAFARI SYSTEM</text>
      <text class="mono" x="48" y="51" font-size="12" fill="var(--ink)">Java MVC platform for staff, visitors, safari bookings, vehicles, and route scheduling.</text>
      <text class="mono" x="48" y="72" font-size="12" fill="var(--muted)">Uses modular OOP design and JDBC-backed workflows for maintainable operations.</text>
      <text class="mono" x="48" y="94" font-size="11" fill="var(--ink)" letter-spacing=".4">JAVA · MVC · JDBC · MYSQL</text>
      <line x1="48" y1="108" x2="952" y2="108" stroke="var(--rule)" stroke-width="1"/>
    </g>
</svg>