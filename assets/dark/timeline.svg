<svg viewBox="0 0 1200 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Education and development timeline">
  <style>
    :root { --ink:#F2F2F2; --muted:#A0A0A0; --dim:#747474; --rule:#3E3E3E; --ghost:#333333; --node:#0D1117; }
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .rise { opacity:0; animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    .fade { opacity:0; animation:fade .7s ease forwards; }
    .draw { stroke-dasharray:1200; stroke-dashoffset:1200; animation:draw 1.5s cubic-bezier(.6,0,.2,1) forwards; }
    .a1{animation-delay:.08s}.a2{animation-delay:.18s}.a3{animation-delay:.30s}.a4{animation-delay:.42s}.a5{animation-delay:.54s}.a6{animation-delay:.66s}.a7{animation-delay:.78s}
    @keyframes rise { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fade { to{opacity:1} }
    @keyframes draw { to{stroke-dashoffset:0} }
    @media (prefers-reduced-motion:reduce) { .rise,.fade,.draw{animation:none;opacity:1}.draw{stroke-dashoffset:0} }
  </style>
  <line x1="48" y1="40" x2="1152" y2="40" stroke="var(--rule)"/>
  <text class="mono" x="48" y="28" font-size="11" fill="var(--muted)" letter-spacing="3.5">THE ROUTE SO FAR</text>
  <text class="mono" x="1152" y="28" font-size="11" fill="var(--muted)" letter-spacing="3.5" text-anchor="end">FIG. 04</text>
  <line class="draw a1" x1="48" y1="125" x2="1152" y2="125" stroke="var(--rule)"/>
  <g class="mono">
    <g class="rise a2"><circle cx="105" cy="125" r="4" fill="var(--ink)"/><line x1="105" y1="121" x2="105" y2="94" stroke="var(--rule)"/><text x="105" y="71" font-size="11" fill="var(--muted)" letter-spacing="2" text-anchor="middle">2020</text><text x="105" y="88" font-size="10.5" fill="var(--ink)" text-anchor="middle">secondary education</text></g>
    <g class="rise a3"><circle cx="330" cy="125" r="4" fill="var(--ink)"/><line x1="330" y1="129" x2="330" y2="156" stroke="var(--rule)"/><text x="330" y="176" font-size="11" fill="var(--muted)" letter-spacing="2" text-anchor="middle">SLIIT · 2023</text><text x="330" y="193" font-size="10.5" fill="var(--ink)" text-anchor="middle">BSc IT · Software Engineering</text></g>
    <g class="rise a4"><circle cx="565" cy="125" r="4" fill="var(--ink)"/><line x1="565" y1="121" x2="565" y2="94" stroke="var(--rule)"/><text x="565" y="71" font-size="11" fill="var(--muted)" letter-spacing="2" text-anchor="middle">2025</text><text x="565" y="88" font-size="10.5" fill="var(--ink)" text-anchor="middle">MongoDB Java Developer Path</text></g>
    <g class="rise a5"><circle cx="805" cy="125" r="4" fill="var(--ink)"/><line x1="805" y1="129" x2="805" y2="156" stroke="var(--rule)"/><text x="805" y="176" font-size="11" fill="var(--muted)" letter-spacing="2" text-anchor="middle">ASIPIYA · 2026</text><text x="805" y="193" font-size="10.5" fill="var(--ink)" text-anchor="middle">Software Engineer Intern</text></g>
    <g class="rise a6"><circle cx="1060" cy="125" r="4" fill="var(--ink)"/><circle cx="1060" cy="125" r="10" stroke="var(--muted)" opacity=".6"/><line x1="1060" y1="121" x2="1060" y2="94" stroke="var(--rule)"/><text x="1060" y="71" font-size="11" fill="var(--muted)" letter-spacing="2" text-anchor="middle">2027</text><text x="1060" y="88" font-size="10.5" fill="var(--ink)" text-anchor="middle">expected graduation</text></g>
  </g>
</svg>