<svg viewBox="0 0 1000 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Selected projects by Pramodya Alahakoon">
  <style>
    :root { --ink:#F2F2F2; --muted:#A0A0A0; --dim:#747474; --rule:#3E3E3E; --ghost:#333333; --node:#0D1117; }
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .rise { opacity:0; animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    .fade { opacity:0; animation:fade .7s ease forwards; }
    .draw { stroke-dasharray:1200; stroke-dashoffset:1200; animation:draw 1.5s cubic-bezier(.6,0,.2,1) forwards; }
    .a1{animation-delay:.08s}.a2{animation-delay:.18s}.a3{animation-delay:.30s}.a4{animation-delay:.42s}.a5{animation-delay:.54s}.a6{animation-delay:.66s}.a7{animation-delay:.78s}
    @keyframes rise { from{opacity:0} to{opacity:1} }
    @keyframes fade { to{opacity:1} }
    @keyframes draw { to{stroke-dashoffset:0} }
    @media (prefers-reduced-motion:reduce) { .rise,.fade,.draw{animation:none;opacity:1}.draw{stroke-dashoffset:0} }
  </style>
  <g class="rise a1" transform="translate(0 20)">
    <text class="mono" x="48" y="24" font-size="17" font-weight="700" fill="var(--ink)" letter-spacing=".8">01 / QUALITY EDUCATION PLATFORM</text>
    <text class="mono" x="48" y="51" font-size="12" fill="var(--ink)">Peer-learning and tutoring platform connecting school students with qualified tutors.</text>
    <text class="mono" x="48" y="72" font-size="12" fill="var(--muted)">Multilingual help, study materials, session scheduling, feedback, and progress tracking.</text>
    <text class="mono" x="48" y="94" font-size="11" fill="var(--ink)" letter-spacing=".4">REACT / NODE.JS / EXPRESS / MONGODB / GEMINI</text>
    <line x1="48" y1="108" x2="952" y2="108" stroke="var(--rule)" stroke-width="1" />
  </g>
  <g class="rise a2" transform="translate(0 140)">
    <text class="mono" x="48" y="24" font-size="17" font-weight="700" fill="var(--ink)" letter-spacing=".8">02 / MEDILINK CLOUD</text>
    <text class="mono" x="48" y="51" font-size="12" fill="var(--ink)">AI-enabled distributed healthcare appointment system using microservices and event-driven communication.</text>
    <text class="mono" x="48" y="72" font-size="12" fill="var(--muted)">Role-based dashboards, telemedicine workflows, and containerized service deployment.</text>
    <text class="mono" x="48" y="94" font-size="11" fill="var(--ink)" letter-spacing=".4">REACT / NODE.JS / MONGODB / RABBITMQ / DOCKER</text>
    <line x1="48" y1="108" x2="952" y2="108" stroke="var(--rule)" stroke-width="1" />
  </g>
  <g class="rise a3" transform="translate(0 260)">
    <text class="mono" x="48" y="24" font-size="17" font-weight="700" fill="var(--ink)" letter-spacing=".8">03 / ELECTRICITY MONITORING APP</text>
    <text class="mono" x="48" y="51" font-size="12" fill="var(--ink)">Mobile app helping families track and manage their electricity usage in real time.</text>
    <text class="mono" x="48" y="72" font-size="12" fill="var(--muted)">Highlights high-usage appliances and provides alerts, reports, and energy-saving guidance.</text>
    <text class="mono" x="48" y="94" font-size="11" fill="var(--ink)" letter-spacing=".4">FLUTTER / DART / REAL-TIME MONITORING / REPORTING</text>
    <line x1="48" y1="108" x2="952" y2="108" stroke="var(--rule)" stroke-width="1" />
  </g>
  <g class="rise a4" transform="translate(0 380)">
    <text class="mono" x="48" y="24" font-size="17" font-weight="700" fill="var(--ink)" letter-spacing=".8">04 / AYURVEDIC PRODUCT DISTRIBUTION</text>
    <text class="mono" x="48" y="51" font-size="12" fill="var(--ink)">Distribution system for Ayurvedic medicines and wellness-product supply chains.</text>
    <text class="mono" x="48" y="72" font-size="12" fill="var(--muted)">Manages inventory, orders, logistics, compliance, batch tracking, and sales analytics.</text>
    <text class="mono" x="48" y="94" font-size="11" fill="var(--ink)" letter-spacing=".4">INVENTORY / ORDERS / LOGISTICS / BATCH TRACKING / ANALYTICS</text>
    <line x1="48" y1="108" x2="952" y2="108" stroke="var(--rule)" stroke-width="1" />
  </g>
</svg>